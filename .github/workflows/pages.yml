name: Deploy City Preview

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static experience
        run: |
          test -s index.html
          test -s thinking.html
          test -s assets/css/city.css
          test -s assets/js/city.js
          test -s assets/js/city-generator.mjs
          test -s assets/js/physics-terrain-adapter.mjs
          test -s assets/js/terrain-interpretation.mjs
          test -s tests/terrain-interpretation.test.mjs
          test -s tests/physics-terrain-adapter.test.mjs
          test -s tests/physics-terrain-overlay.test.mjs
          test -s tests/physics-terrain-snapshot.test.mjs
          test -s data/places.json
          test -s data/city-blueprint.json
          test -s data/city-systems.json
          test -s data/vehicles/vehicle-catalog.json
          test -s data/construction/capability-profiles.json
          test -s tests/vehicle-construction-capabilities.test.mjs
          test -s data/economy/civic-quarter-market.json
          test -s tests/economy-scenario.test.mjs
          test -s docs/ECONOMY_IN_SINGULARITY_CITY.md
          test -s docs/GREENHOLLOW_CIVIC_STRESS_TEST.md
          test -s docs/CIVIC_PROCESS_MODEL.md
          test -s schemas/civic-process-response.schema.json
          test -s assets/js/civic-authorization-gate.mjs
          test -s tests/civic-process-contract.test.mjs
          test -s docs/books/vehicles.md
          test -s docs/books/buildings-and-construction.md
          test -s docs/books/thieves-and-shadow-work.md
          test -s docs/books/thieves-and-shadow-work.book.json
          test -s docs/books/covers/thieves-and-shadow-work.svg
          test -s docs/books/urban-underworld.md
          test -s docs/books/urban-underworld.book.json
          test -s docs/books/covers/urban-underworld.svg
          test -s docs/books/law-enforcement-and-public-safety.md
          test -s docs/books/law-enforcement-and-public-safety.book.json
          test -s docs/books/covers/law-enforcement-and-public-safety.svg
          test -s docs/books/justice-courts-and-restitution.md
          test -s docs/books/justice-courts-and-restitution.book.json
          test -s docs/books/covers/justice-courts-and-restitution.svg
          test -s docs/books/governance-and-civic-administration.md
          test -s docs/books/governance-and-civic-administration.book.json
          test -s docs/books/covers/governance-and-civic-administration.svg
          test -s docs/books/politics-power-and-public-will.md
          test -s docs/books/politics-power-and-public-will.book.json
          test -s docs/books/covers/politics-power-and-public-will.svg
          test -s docs/books/elections-and-player-participation.md
          test -s docs/books/elections-and-player-participation.book.json
          test -s docs/books/covers/elections-and-player-participation.svg
          test -s docs/books/vigilantes-and-civic-justice.md
          test -s docs/books/vigilantes-and-civic-justice.book.json
          test -s docs/books/covers/vigilantes-and-civic-justice.svg
          test -s docs/books/villains-and-antagonists.md
          test -s docs/books/villains-and-antagonists.book.json
          test -s data/elections/greenhollow-reeve-election.json
          test -s data/scenarios/greenhollow-civic-stress-test.json
          test -s tests/greenhollow-civic-stress-test.test.mjs
          test -s tests/greenhollow-election-fixture.test.mjs
          test -s tests/surps-participation-manifest.test.mjs
          test -s docs/books/covers/villains-and-antagonists.svg
          test -s tests/underworld-sourcebooks.test.mjs
          test -s tests/civic-governance-sourcebooks.test.mjs
          test -s docs/rulebooks/SurpsRulebookVehiclesAndMobility.md
          test -s docs/rulebooks/SurpsRulebookBuildingsAndConstruction.md
          test -s data/commerce-route-fixture.json
          test -s tests/commerce-route-fixture.test.mjs
          test -s data/districts/civic-quarter.json
          test -s data/terrain/city-terrain.json
          test -s data/terrain/physics-volcanic-terrain.json
          test -s data/map-layers.json
          test -s schemas/city-terrain.schema.json
          test -s schemas/map-layer-catalog.schema.json
          test -s schemas/civic-district.schema.json
          test -s docs/CIVIC_QUARTER_VERTICAL_SLICE.md
          test -s docs/MAPS_AS_CITY_DATA.md
          test -s docs/CITY_BUILDER_AND_FIRST_PERSON_EXPERIENCE.md
          test -s schemas/city-systems.schema.json
          test -s schemas/city-blueprint.schema.json
          test -s schemas/source-observation.schema.json
          test -s docs/SOURCE_RESEARCH.md
          test -s docs/LIVING_PICTURE.md
          test -s docs/CIVIL_SYSTEMS_AND_CITY_THEORY.md
          test -s assets/images/living-city-atlas.svg
          test -s assets/images/singularity-workshop-avatar.svg
          test -s docs/ARCHITECTURE.md
          test -s docs/CITY_MODEL.md
          test -s docs/EXPERIENCES.md
          test -s docs/BUILD_YOUR_CITY.md
          test -s docs/WHEEL_OF_TIME_SHOWCASE.md
          test -s docs/rulebooks/SurpsRulebookVillagesToCities.md
          test -s docs/REALITY_AND_RECONSTRUCTION.md
          test -s docs/books/places/gobekli-tepe/README.md
          test -s AgentOnboarding.md
          test -s .github/workflows/ciai-evidence.yml
          node tests/validate-catalog.mjs
          node tests/commerce-route-fixture.test.mjs
          node tests/economy-scenario.test.mjs
          node tests/vehicle-construction-capabilities.test.mjs
          node tests/underworld-sourcebooks.test.mjs
          node tests/civic-governance-sourcebooks.test.mjs
          node tests/elections-vigilantes-villains.test.mjs
          node tests/greenhollow-election-fixture.test.mjs
          node tests/greenhollow-civic-stress-test.test.mjs
          node tests/civic-process-contract.test.mjs
          node tests/surps-participation-manifest.test.mjs
          node tests/physics-terrain-adapter.test.mjs
          node tests/terrain-interpretation.test.mjs
          node --test tests/physics-terrain-overlay.test.mjs tests/physics-terrain-snapshot.test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
