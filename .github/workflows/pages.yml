name: Deploy City Preview

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static experience
        run: |
          test -s index.html
          test -s assets/css/city.css
          test -s assets/js/city.js
          test -s docs/ARCHITECTURE.md
          test -s docs/CITY_MODEL.md
          test -s docs/EXPERIENCES.md
          grep -q 'id="city"' index.html
          grep -q 'function selectPlace' assets/js/city.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
