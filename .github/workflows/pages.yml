name: Deploy City Preview

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static experience
        run: |
          test -s index.html
          test -s thinking.html
          test -s assets/css/city.css
          test -s assets/js/city.js
          test -s assets/js/city-generator.mjs
          test -s assets/js/physics-terrain-adapter.mjs
          test -s assets/js/terrain-interpretation.mjs
          test -s tests/terrain-interpretation.test.mjs
          test -s tests/physics-terrain-adapter.test.mjs
          test -s tests/physics-terrain-overlay.test.mjs
          test -s tests/physics-terrain-snapshot.test.mjs
          test -s data/places.json
          test -s data/city-blueprint.json
          test -s data/city-systems.json
          test -s data/commerce-route-fixture.json
          test -s tests/commerce-route-fixture.test.mjs
          test -s data/districts/civic-quarter.json
          test -s data/terrain/city-terrain.json
          test -s data/terrain/physics-volcanic-terrain.json
          test -s data/map-layers.json
          test -s schemas/city-terrain.schema.json
          test -s schemas/map-layer-catalog.schema.json
          test -s schemas/civic-district.schema.json
          test -s docs/CIVIC_QUARTER_VERTICAL_SLICE.md
          test -s docs/MAPS_AS_CITY_DATA.md
          test -s docs/CITY_BUILDER_AND_FIRST_PERSON_EXPERIENCE.md
          test -s schemas/city-systems.schema.json
          test -s schemas/city-blueprint.schema.json
          test -s schemas/source-observation.schema.json
          test -s docs/SOURCE_RESEARCH.md
          test -s docs/LIVING_PICTURE.md
          test -s docs/CIVIL_SYSTEMS_AND_CITY_THEORY.md
          test -s assets/images/living-city-atlas.svg
          test -s assets/images/singularity-workshop-avatar.svg
          test -s docs/ARCHITECTURE.md
          test -s docs/CITY_MODEL.md
          test -s docs/EXPERIENCES.md
          test -s docs/BUILD_YOUR_CITY.md
          test -s docs/WHEEL_OF_TIME_SHOWCASE.md
          test -s docs/rulebooks/SurpsRulebookVillagesToCities.md
          test -s docs/REALITY_AND_RECONSTRUCTION.md
          test -s docs/books/places/gobekli-tepe/README.md
          test -s AgentOnboarding.md
          test -s .github/workflows/ciai-evidence.yml
          node tests/validate-catalog.mjs
          node tests/commerce-route-fixture.test.mjs
          node tests/physics-terrain-adapter.test.mjs
          node tests/terrain-interpretation.test.mjs
          node --test tests/physics-terrain-overlay.test.mjs tests/physics-terrain-snapshot.test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
