<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 360" role="img"
     aria-labelledby="title desc">
  <title id="title">The Singularity Workshop</title>
  <desc id="desc">The original Workshop avatar with a smoothly cycling orange, cyan, and magenta color treatment.</desc>
  <defs>
    <filter id="color-cycle" color-interpolation-filters="sRGB">
      <feFlood flood-color="#ff7a18" result="tint">
        <animate attributeName="flood-color"
                 values="#ff7a18;#00d9ff;#ff00c8;#ff7a18"
                 keyTimes="0;0.3333;0.6667;1"
                 dur="9s" repeatCount="indefinite"
                 calcMode="spline"
                 keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      </feFlood>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="colored"/>
      <feBlend in="SourceGraphic" in2="colored" mode="color"/>
    </filter>
  </defs>
  <image x="0" y="0" width="1200" height="360"
         xlink:href="https://raw.githubusercontent.com/TrentBest/FSM_API/master/Documentation/Branding/TheSingularityWorkshop.png"
         href="https://raw.githubusercontent.com/TrentBest/FSM_API/master/Documentation/Branding/TheSingularityWorkshop.png"
         preserveAspectRatio="xMidYMid meet" filter="url(#color-cycle)"/>
</svg>
