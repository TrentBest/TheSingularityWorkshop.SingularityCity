<path d="M468 136h36m-10-8 10 8-10 8" fill="none" stroke="#65e4dc" stroke-width="3"/>
<g transform="translate(512 48)"><rect width="190" height="176" rx="12" fill="#102b3d" stroke="#65e4dc"/><text x="18" y="30" fill="#65e4dc" font-size="11" letter-spacing="2">03 · DESIGN</text><path d="M30 143V79l65-34 65 34v64z" fill="#1d465b" stroke="#e7c27c" stroke-width="2"/><path d="M95 45v98M30 79h130" stroke="#65e4dc" stroke-width="2"/><text x="18" y="164" font-size="17" font-weight="700">Facade + interior</text></g>
