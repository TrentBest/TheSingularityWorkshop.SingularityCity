<text x="28" y="278" fill="#9bb0bf" font-family="monospace" font-size="11" letter-spacing="1.5">CURRENT PROTOTYPE: STEPS 01–03 ARE LOCAL DEMONSTRATIONS · STEP 04 REQUIRES TRUSTED HOST SERVICES</text>
